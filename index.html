<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Crease — Live Cricket Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;
  --bg-2:#0d1117;
  --panel:#121820;
  --panel-2:#161e28;
  --border:#232c38;
  --text:#eef2f6;
  --muted:#8b96a5;
  --dim:#5c6774;
  --amber:#ffb020;
  --amber-glow:rgba(255,176,32,.35);
  --green:#3ad182;
  --red:#ef4444;
  --team-a:#2563eb;
  --team-a-dark:#0f2e73;
  --team-b:#e11d48;
  --team-b-dark:#5c0a1e;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,176,32,.06), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:920px;margin:0 auto;padding:16px 16px 100px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:0 2px;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#c97b0e);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1200;font-family:'Rajdhani',sans-serif;font-size:16px;flex-shrink:0;}
.brand-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;}
.brand-tag{color:var(--dim);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-left:auto;}

/* ---- HEADER / VERSUS BAR ---- */
.versus{
  position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
  display:flex;min-height:120px;background:var(--panel);
}
.versus-side{flex:1;position:relative;display:flex;align-items:center;gap:12px;padding:16px 18px;overflow:hidden;z-index:1;}
.versus-side.a{background:linear-gradient(120deg,var(--team-a-c,#2563eb) 0%, color-mix(in srgb, var(--team-a-c,#2563eb) 55%, black) 90%);clip-path:polygon(0 0,100% 0,92% 100%,0% 100%);}
.versus-side.b{background:linear-gradient(300deg,var(--team-b-c,#e11d48) 0%, color-mix(in srgb, var(--team-b-c,#e11d48) 55%, black) 90%);clip-path:polygon(8% 0,100% 0,100% 100%,0 100%);justify-content:flex-end;text-align:right;}
.versus-side.b .t-info{align-items:flex-end;}
.t-badge{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:21px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.35);color:#fff;overflow:hidden;}
.t-badge img{width:100%;height:100%;object-fit:cover;}
.t-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.t-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.t-short{font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.7);text-transform:uppercase;}
.t-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:#fff;margin-top:2px;}
.vs-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--amber);
  display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;color:var(--amber);
}
.match-status{
  text-align:center;font-size:12px;color:var(--muted);padding:10px 12px;letter-spacing:.3px;
  border-left:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  border-radius:0 0 var(--radius) var(--radius);background:var(--panel-2);margin-top:-1px;
}
.match-status b{color:var(--amber);font-weight:600;}

/* ---- SCORE PANEL ---- */
.score-panel{
  position:relative;margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);
  background:radial-gradient(ellipse 140% 100% at 0% 0%, color-mix(in srgb, var(--batting-team-c,var(--amber)) 10%, var(--panel)), var(--panel) 60%);
  padding:22px 20px 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;overflow:hidden;
}
.score-panel::before{
  content:'';position:absolute;top:0;left:18px;right:18px;height:3px;
  background:linear-gradient(90deg, transparent, var(--batting-team-c,var(--amber)) 20%, var(--batting-team-c,var(--amber)) 80%, transparent);
  border-radius:0 0 3px 3px;
}
.score-main{display:flex;align-items:baseline;gap:10px;}
.score-digits{
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:48px;line-height:1;color:var(--amber);
  text-shadow:0 0 18px var(--amber-glow);letter-spacing:1px;
}
.score-overs{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--muted);}
.score-meta{display:flex;gap:22px;flex-wrap:wrap;}
.meta-item{display:flex;flex-direction:column;gap:2px;}
.meta-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);}
.meta-val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--text);}
.meta-val.hot{color:var(--green);}
.target-banner{
  width:100%;padding:12px 16px;border-radius:10px;background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.4);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.target-banner-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--red);}
.target-banner-num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:var(--text);}
.target-banner-sub{font-size:12.5px;color:var(--muted);}
.target-banner-sub b{color:var(--text);}

/* ---- BATSMEN / OVER ---- */
.play-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;}
.bats-card{
  position:relative;flex:1;min-width:230px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel);padding:16px 16px 14px;overflow:hidden;
}
.bats-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--batting-team-c,var(--amber)), color-mix(in srgb, var(--batting-team-c,var(--amber)) 40%, transparent));
}
.bats-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.bats-card-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);}
.swap-strike-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 9px;font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:600;cursor:pointer;}
.swap-strike-btn:hover{border-color:var(--amber);color:var(--amber);}
.bats-line{display:flex;align-items:center;justify-content:space-between;padding:7px 0;cursor:pointer;border-radius:8px;}
.bats-line:hover{background:var(--panel-2);}
.bats-line + .bats-line{border-top:1px solid var(--border);}
.bats-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.bats-name .dot{width:7px;height:7px;border-radius:50%;background:var(--batting-team-c,var(--amber));box-shadow:0 0 6px var(--batting-team-c,var(--amber));flex-shrink:0;}
.bats-stats{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);white-space:nowrap;}
.bats-stats b{color:var(--text);}
.bowl-card{
  position:relative;flex:1;min-width:230px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel);padding:16px 16px 14px;overflow:hidden;
}
.bowl-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--bowling-team-c,var(--red)), color-mix(in srgb, var(--bowling-team-c,var(--red)) 40%, transparent));
}
.bowl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;border-radius:8px;padding:4px 4px 4px 0;}
.bowl-head:hover{background:var(--panel-2);}
.bowl-profile{display:flex;align-items:center;gap:9px;}
.bowl-name{font-size:14px;font-weight:600;}
.bowl-fig{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
.bowl-fig b{color:var(--text);}
.over-dots{display:flex;gap:6px;flex-wrap:wrap;}
.over-history-row{margin-top:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:12px 14px;}
.over-history-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:8px;}
.over-history-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.over-pill{flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px;}
.over-pill.wk{border-color:var(--red);background:rgba(239,68,68,.08);}
.over-pill .op-num{font-size:9px;color:var(--dim);font-family:'Rajdhani',sans-serif;letter-spacing:.5px;}
.over-pill .op-runs{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--text);}
.over-pill.wk .op-runs{color:var(--red);}
.over-pill .op-bowler{font-size:9px;color:var(--muted);margin-top:1px;}
.ball-chip{
  min-width:26px;height:26px;padding:0 6px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--text);
}
.ball-chip.four{background:rgba(58,209,130,.15);border-color:var(--green);color:var(--green);}
.ball-chip.six{background:rgba(255,176,32,.15);border-color:var(--amber);color:var(--amber);}
.ball-chip.wicket{background:rgba(239,68,68,.18);border-color:var(--red);color:var(--red);}
.ball-chip.extra{background:rgba(139,150,165,.15);color:var(--muted);}
.ball-chip.dot0{color:var(--dim);}

/* ---- TABS ---- */
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{
  background:none;border:none;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.5px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab-btn.active{color:var(--amber);border-color:var(--amber);}
.tab-btn:hover:not(.active){color:var(--text);}
.tab-panel{padding-top:16px;}

/* ---- TABLES ---- */
.card-table{width:100%;border-collapse:collapse;font-size:13px;}
.card-table th{text-align:left;color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:8px 6px;border-bottom:1px solid var(--border);}
.card-table td{padding:9px 6px;border-bottom:1px solid var(--border);color:var(--text);}
.card-table td.num,.card-table th.num{text-align:right;font-family:'JetBrains Mono',monospace;}
.card-table tr:last-child td{border-bottom:none;}
.card-table .player-cell{display:flex;align-items:center;gap:8px;}
.status-pill{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--panel-2);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.status-pill.out{color:var(--red);}
.status-pill.notout{color:var(--green);}
.section-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;color:var(--text);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.extras-line{font-size:12px;color:var(--muted);margin:-4px 0 10px;}
.extras-line b{color:var(--text);}
.extras-breakdown{color:var(--dim);}
.section-title .bar{width:4px;height:14px;border-radius:2px;background:var(--amber);}
.empty-note{color:var(--dim);font-size:13px;padding:20px 4px;text-align:center;}

/* ---- SQUAD ---- */
.squad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.squad-grid{grid-template-columns:1fr;}}
.squad-team{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;}
.squad-team-head{padding:12px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg, color-mix(in srgb, var(--tc,#2563eb) 30%, var(--panel)), var(--panel));}
.squad-list{max-height:420px;overflow-y:auto;}
.squad-player{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;overflow:hidden;font-family:'Rajdhani',sans-serif;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.squad-player input[type=text]{flex:1;min-width:0;}
.icon-btn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;width:26px;height:26px;flex-shrink:0;cursor:pointer;font-size:13px;line-height:1;}
.icon-btn:hover{color:var(--red);border-color:var(--red);}
.add-player-row{padding:10px 14px;}

/* ---- FORMS ---- */
input[type=text],input[type=number],input[type=url],select{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;width:100%;
}
input[type=text]:focus,input[type=number]:focus,select:focus,input[type=url]:focus{outline:none;border-color:var(--amber);}
input[type=color]{width:44px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);cursor:pointer;}
label.field-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:4px;display:block;}
.field{margin-bottom:12px;}
.field-row{display:flex;gap:10px;align-items:flex-end;}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.setup-grid{grid-template-columns:1fr;}}
.setup-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:16px;}
.setup-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.btn{
  font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.4px;border:none;border-radius:10px;padding:12px 20px;
  cursor:pointer;font-size:14px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);
}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:linear-gradient(135deg,var(--amber),#c97b0e);color:#1a1200;border:none;}
.btn.primary:hover{filter:brightness(1.08);color:#1a1200;}
.btn.full{width:100%;}
.btn.danger:hover{border-color:var(--red);color:var(--red);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---- SCORING PAD ---- */
.pad-wrap{position:sticky;bottom:0;margin-top:18px;background:linear-gradient(180deg, transparent, var(--bg) 22%);padding-top:14px;}
.pad{position:relative;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:14px;overflow:hidden;}
.pad::before{
  content:'';position:absolute;top:0;left:16px;right:16px;height:3px;
  background:linear-gradient(90deg, transparent, var(--batting-team-c,var(--amber)) 20%, var(--batting-team-c,var(--amber)) 80%, transparent);
  border-radius:0 0 3px 3px;
}
.pad-runs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
.pad-btn{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;padding:14px 0;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);cursor:pointer;
}
.pad-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.08);}
.pad-btn.six{color:var(--amber);}
.pad-btn.four{color:var(--green);}
.pad-extra{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(min-width:520px){.pad-extra{grid-template-columns:repeat(4,1fr);}}
@media(min-width:760px){.pad-extra{grid-template-columns:repeat(8,1fr);}}
.pad-extra .pad-btn{font-family:'Rajdhani',sans-serif;font-size:12.5px;padding:11px 4px;letter-spacing:.3px;}
.pad-extra .pad-btn.wicket{color:var(--red);}
.pad-extra .pad-btn.wicket:hover{border-color:var(--red);background:rgba(239,68,68,.1);}
.pad-extra .pad-btn.pause{color:var(--muted);}
.pad-extra .pad-btn.pause:hover{border-color:var(--muted);color:var(--text);background:var(--panel-2);}
.pad-extra .pad-btn.end-innings{color:var(--muted);}
.pad-extra .pad-btn.end-innings:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08);}
.pad-foot{display:flex;gap:8px;margin-top:10px;}
.pad-foot .btn{flex:1;padding:10px;font-size:12.5px;}
.pause-banner{
  border:1px solid rgba(239,68,68,.45);border-radius:var(--radius);background:rgba(239,68,68,.07);
  padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.pause-icon{font-size:28px;line-height:1;flex-shrink:0;}
.pause-info{flex:1;min-width:180px;}
.pause-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--red);}
.pause-reason{font-size:12.5px;color:var(--muted);margin-top:2px;}
.pause-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:400px;padding:20px;max-height:85vh;overflow-y:auto;position:relative;}
.modal-close{
  position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{color:var(--red);border-color:var(--red);}
.modal-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;margin-bottom:14px;padding-right:26px;}
.modal-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.modal-choice{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px;cursor:pointer;font-size:13.5px;text-align:left;display:flex;align-items:center;gap:9px;}
.modal-choice:hover{border-color:var(--amber);}
.modal-choice small{color:var(--dim);display:block;font-size:11px;margin-top:1px;}
.result-banner{
  margin-top:14px;border:1px solid var(--amber);border-radius:var(--radius);background:linear-gradient(135deg, rgba(255,176,32,.1), var(--panel));
  padding:18px;text-align:center;
}
.result-banner .rb-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;color:var(--amber);}
.result-banner .rb-sub{color:var(--muted);font-size:13px;margin-top:4px;}
.celebrate-banner{
  position:relative;margin-bottom:12px;border-radius:var(--radius);padding:16px 44px 16px 18px;
  display:flex;align-items:center;gap:14px;overflow:hidden;
}
.celebrate-banner.milestone{border:1px solid rgba(255,176,32,.5);background:linear-gradient(120deg, rgba(255,176,32,.15), var(--panel));}
.celebrate-banner.hattrick{border:1px solid rgba(239,68,68,.5);background:linear-gradient(120deg, rgba(239,68,68,.15), var(--panel));}
.celebrate-emoji{font-size:32px;line-height:1;flex-shrink:0;}
.celebrate-title{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:18px;letter-spacing:1px;}
.milestone .celebrate-title{color:var(--amber);}
.hattrick .celebrate-title{color:var(--red);}
.celebrate-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.celebrate-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:11px;}
.celebrate-close:hover{color:var(--text);border-color:var(--text);}
.comm-feed{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:12px 14px;}
.comm-feed-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:8px;}
.comm-feed-scroll{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.comm-row{display:flex;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border);}

let state = defaultState();

/* ===================== LIVE STREAM OVERLAY WIRING ===================== */
const OVERLAY_STORAGE_KEY = 'crease_overlay_state_v1';

    return sp.get('overlay')==='1' || location.hash.indexOf('overlay')!==-1;
  }catch(e){ return false; }
})();
const overlayType = (function(){
  try{
    const sp = new URLSearchParams(location.search);
    return sp.get('type') || 'lowerthird';
  }catch(e){ return 'lowerthird'; }
})();
const overlayCloudDb = (function(){
  try{ return new URLSearchParams(location.search).get('db') || ''; }catch(e){ return ''; }
})();
const overlayCloudRoom = (function(){
  try{ return new URLSearchParams(location.search).get('room') || ''; }catch(e){ return ''; }

function overlayLink(type){

      q += '&db=' + encodeURIComponent(cloudConfig.databaseURL) + '&room=' + encodeURIComponent(cloudConfig.room);
    }

  }catch(e){

function fallbackCopyText(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ /* clipboard unavailable, ignore */ }
}
function copyOverlayLink(type, btnEl){
  const text = overlayLink(type);
  const flash = ()=>{ if(btnEl){ const orig = btnEl.textContent; btnEl.textContent = 'Copied!'; setTimeout(()=>{ btnEl.textContent = orig; }, 1400); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash).catch(()=>{ fallbackCopyText(text); flash(); });
  } else {
    fallbackCopyText(text); flash();
  }
}

  const topBats = batters.slice(0,2);
  let topBowl = null;
  Object.keys(bowlingObj||{}).forEach(id=>{
    const b = bowlingObj[id];
    if(!topBowl || b.wickets > topBowl.wickets || (b.wickets===topBowl.wickets && b.runs < topBowl.runs)) topBowl = {id, wickets:b.wickets, runs:b.runs};
  });
  return {
    topBatters: topBats.map(t=>({name: playerName(t.id), runs:t.runs, balls:t.balls})),

    if(e.key===OVERLAY_STORAGE_KEY && e.newValue){
      try{ overlayState = JSON.parse(e.newValue); renderOverlayPage(); }catch(err){}
    }
  });
  setInterval(()=>{
    try{
      const raw = localStorage.getItem(OVERLAY_STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(JSON.stringify(parsed)!==JSON.stringify(overlayState)){ overlayState = parsed; renderOverlayPage(); }
      }
    }catch(e){}
  }, 1000);
  if(overlayType==='alerts'){
    setInterval(renderOverlayPage, 1000);
  }
  if(overlayCloudDb && overlayCloudRoom){
    const pollCloud = ()=>{
      const url = `${overlayCloudDb}/matches/${encodeURIComponent(overlayCloudRoom)}.json`;
      fetch(url).then(r=>r.json()).then(data=>{
        if(data && JSON.stringify(data)!==JSON.stringify(overlayState)){ overlayState = data; renderOverlayPage(); }
      }).catch(()=>{});
    };
    pollCloud();
    setInterval(pollCloud, 1500);
  }
}

/* ===================== HELPERS ===================== */
function shade(hex, percent){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r=(num>>16), g=(num>>8 & 0x00FF), b=(num & 0x0000FF);
  r = Math.min(255,Math.max(0, Math.round(r + (percent/100)*255)));
  g = Math.min(255,Math.max(0, Math.round(g + (percent/100)*255)));
  b = Math.min(255,Math.max(0, Math.round(b + (percent/100)*255)));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function team(i){ return state.teams[i]; }

  return null;
}

function oversStr(balls){

}
function crr(){

function rrr(){

  const remBalls = state.oversLimit*6 - state.balls;

  });
  const firstInn = state.inningsHistory[0], secondInn = state.inningsHistory[1];

  } else if(secondInn.score === state.target-1){

  } else {
    const margin = (state.target-1) - secondInn.score;
    state.result = `${teamFirst.short} won by ${margin} run${margin===1?'':'s'}`;
  }
  if(state.result === 'Match tied' || state.result === 'Super Over tied'){

/* ---- ball events ---- */
function addRuns(runs){
  if(state.matchOver || state.paused) return;
  pushHistory();
  const bat = state.batting[state.strikerId];
  const prevRuns = bat.runs;
  bat.runs += runs; bat.balls += 1;
  if(runs===4) bat.fours++;
  if(runs===6) bat.sixes++;
  state.score += runs;
  state.balls += 1;
  const bowl = state.bowling[state.bowlerId];
  bowl.balls += 1; bowl.runs += runs;
  state.thisOver.push({t: runs===0?'dot':(runs===4?'four':runs===6?'six':'run'), v:String(runs)});
  addCommentary(runs===0?'no run':(runs===4?`FOUR! ${playerName(state.strikerId)}`:runs===6?`SIX! ${playerName(state.strikerId)}`:`${runs} run${runs>1?'s':''}`));
  checkMilestone(state.strikerId, prevRuns, bat.runs, bat.balls);
  trackHatTrick(false);
  if(runs%2===1) swapStrike();
  finishBallProgress();
}
function addExtra(kind){
  if(state.matchOver || state.paused) return;
  if(kind==='noball'){
    openModal({kind:'noBallRuns'});
    return;
  }
  if(kind==='wide'){
    openModal({kind:'wideRuns'});
    return;
  }

}
function confirmWideRuns(extraRuns){

  state.extras.wide += 1;
  const bowl = state.bowling[state.bowlerId];
  bowl.runs += 1 + extraRuns;
  state.thisOver.push({t:'extra', v: extraRuns>0 ? ('Wd+'+extraRuns) : 'Wd'});
  addCommentary(`Wide${extraRuns>0?', +'+extraRuns+' run'+(extraRuns>1?'s':''):''}`);
  trackHatTrick(false);
  closeModal();
  finishOverCheckOnly();
  render();
}
function confirmNoBall(runsOffBat){
  pushHistory();
  state.score += 1 + runsOffBat;
  state.extras.noball += 1;
  const bat = state.batting[state.strikerId];
  const prevRuns = bat.runs;
  if(runsOffBat>0){
    bat.runs += runsOffBat;
    if(runsOffBat===4) bat.fours++;
    if(runsOffBat===6) bat.sixes++;
  }
  const bowl = state.bowling[state.bowlerId];
  bowl.runs += 1 + runsOffBat;
  state.thisOver.push({t:'extra', v: runsOffBat>0 ? ('Nb+'+runsOffBat) : 'Nb'});
  addCommentary(`No ball${runsOffBat>0?', +'+runsOffBat+' run'+(runsOffBat>1?'s':''):''}`);
  checkMilestone(state.strikerId, prevRuns, bat.runs, bat.balls);
  trackHatTrick(false);
  closeModal();

}
function addByes(runs, legbye){
  if(state.matchOver || state.paused) return;
  pushHistory();
  state.score += runs;
  state.balls += 1;
  if(legbye) state.extras.legbye += runs; else state.extras.bye += runs;
  const bat = state.batting[state.strikerId];
  bat.balls += 1;
  const bowl = state.bowling[state.bowlerId];
  bowl.balls += 1;
  state.thisOver.push({t:'extra', v:(legbye?'LB':'B')+runs});
  addCommentary(`${runs} ${legbye?'leg bye':'bye'}${runs>1?'s':''}`);
  trackHatTrick(false);
  if(runs%2===1) swapStrike();
  closeModal();
  finishBallProgress();
}
function extrasSum(ex){
  if(!ex) return 0;
  return (ex.wide||0)+(ex.noball||0)+(ex.bye||0)+(ex.legbye||0);
}
function addCommentary(text){
  state.commentary.push({over: oversStr(state.balls), text});
  if(state.commentary.length>200) state.commentary.shift();
}
function checkMilestone(playerId, prevRuns, newRuns, ballsFaced){
  const cross = (thresh)=> prevRuns < thresh && newRuns >= thresh;
  if(cross(100)){
    state.lastMilestone = {playerId, milestone:100, ballsFaced, ts: Date.now()};
  } else if(cross(50)){
    state.lastMilestone = {playerId, milestone:50, ballsFaced, ts: Date.now()};
  }
}
function dismissMilestone(){ state.lastMilestone = null; render(); }
function dismissHatTrick(){ state.lastHatTrick = null; render(); }
function trackHatTrick(isWicketCredited){
  const bid = state.bowlerId;
  if(!bid) return;
  if(!state.bowlerWicketStreak) state.bowlerWicketStreak = {};
  if(isWicketCredited){
    state.bowlerWicketStreak[bid] = (state.bowlerWicketStreak[bid]||0) + 1;
    if(state.bowlerWicketStreak[bid] >= 3){
      state.lastHatTrick = {bowlerId: bid, ts: Date.now()};
      state.bowlerWicketStreak[bid] = 0;
    }
  } else {
    state.bowlerWicketStreak[bid] = 0;
  }
}
function swapStrike(){
  const tmp = state.strikerId; state.strikerId = state.nonStrikerId; state.nonStrikerId = tmp;
}
function finishOverCheckOnly(){
  /* wide/no-ball: no ball count change, nothing else needed right now */
}
function ballRuns(b){
  if(b.t==='dot') return 0;
  if(b.t==='run' || b.t==='four' || b.t==='six') return parseInt(b.v,10) || 0;
  if(b.t==='wicket'){ const m = b.v.match(/^(\d+)\+W/); return m ? parseInt(m[1],10) : 0; }
  if(b.t==='extra'){
    if(b.v.indexOf('Wd')===0){ const m = b.v.match(/Wd\+(\d+)/); return 1 + (m ? parseInt(m[1],10) : 0); }
    if(b.v.indexOf('Nb')===0){ const m = b.v.match(/Nb\+(\d+)/); return 1 + (m ? parseInt(m[1],10) : 0); }
    const m = b.v.match(/\d+/); return m ? parseInt(m[0],10) : 1;
  }
  return 0;
}
function recordCompletedOver(){
  const runs = state.thisOver.reduce((sum,b)=>sum+ballRuns(b), 0);
  const wkts = state.thisOver.filter(b=>b.t==='wicket').length;
  state.overHistory.push({
    overNumber: state.overHistory.length+1,
    bowlerId: state.bowlerId,
    runs, wickets: wkts,
    balls: state.thisOver.slice()
  });
  state.thisOver = [];
}
function finishBallProgress(){
  const overComplete = state.balls>0 && state.balls%6===0;
  if(overComplete) recordCompletedOver();
  if(checkInningsEnd()){ render(); return; }
  if(overComplete){
    swapStrike();
    state.lastOverBowlerId = state.bowlerId;
    openModal({kind:'pickBowler'});
    return;
  }
  render();
}

const WICKET_TYPES = ['Bowled','Caught','LBW','Run Out','Stumped','Hit Wicket','Retired Hurt','Retired Out','Timed Out','Obstructing the Field','Handled the Ball'];
const PAUSE_REASONS = ['Drinks Break','Rain Delay','Injury Break','Bad Light','Strategic Timeout','Other'];
const MANDATORY_MODALS = ['pickBowler'];
function pauseMatch(reason){
  state.paused = true;
  state.pauseReason = reason;
  closeModal();
}
function resumeMatch(){
  state.paused = false;
  state.pauseReason = '';
  render();
}
function dlsResourcePercent(oversRemaining, oversTotal, wicketsLost){
  if(oversTotal<=0) return 0;
  const overFactor = Math.max(0, Math.min(1, oversRemaining/oversTotal));
  const wicketFactor = Math.max(0, 1 - (wicketsLost/10)*0.65);
  return overFactor * wicketFactor * 100;
}
function applyDLSRevision(newOversLimit){
  if(!state.inningsHistory[0]) return;
  const team1Score = state.inningsHistory[0].score;
  const oversBowled = state.balls/6;
  const oversRemainingNew = Math.max(0, newOversLimit - oversBowled);
  const resourceAfter = dlsResourcePercent(oversRemainingNew, newOversLimit, state.wickets);
  const revisedTarget = Math.ceil(team1Score * (resourceAfter/100)) + 1;
  state.oversLimit = newOversLimit;
  state.target = Math.max(state.score+1, revisedTarget);
  state.dls.active = true;
  state.dls.revisedOvers = newOversLimit;
  state.dls.revisedTarget = state.target;
}
function applyDLSFromInput(){
  const input = document.getElementById('dlsOversInput');
  if(!input) return;
  const val = parseInt(input.value,10);
  if(!val || val<1) return;
  const minOvers = Math.max(1, Math.ceil(state.balls/6));
  const clamped = Math.max(minOvers, Math.min(state.oversLimit, val));
  applyDLSRevision(clamped);
  closeModal();
  resumeMatch();
}
function creditsBowler(how){
  return how==='Bowled' || how==='Caught' || how==='LBW' || how==='Stumped' || how==='Hit Wicket';

function dismissalText(bat){
  if(!bat || !bat.out) return 'not out';
  const bowlerName = bat.dismissalBowlerId ? playerName(bat.dismissalBowlerId) : '';
  switch(bat.howOut){
    case 'Bowled': return `b ${bowlerName}`;
    case 'LBW': return `lbw b ${bowlerName}`;
    case 'Hit Wicket': return `hit wicket b ${bowlerName}`;
    case 'Caught': return bat.fielderId ? `c ${playerName(bat.fielderId)} b ${bowlerName}` : `c & b ${bowlerName}`;
    case 'Stumped': return `st ${bat.fielderId ? playerName(bat.fielderId) : '†'} b ${bowlerName}`;
    case 'Run Out': return `run out (${bat.fielderId ? playerName(bat.fielderId) : '?'}${bat.assistId ? '/'+playerName(bat.assistId) : ''})`;
    default: return bat.howOut;
  }
}
function forceEndInnings(){
  pushHistory();
  closeModal();
  if(state.innings===1){ endInningsOne(); } else { endMatch(); }
  render();
}
function confirmWicket(nextBatterId){
  pushHistory();
  const how = state.modal.how;
  const outId = state.modal.outId || state.strikerId;
  const runs = state.modal.runs || 0;
  const fielderId = state.modal.fielderId || null;
  const assistId = state.modal.assistId || null;
  const strikerBat = state.batting[state.strikerId];
  strikerBat.balls += 1;
  if(runs>0){ strikerBat.runs += runs; state.score += runs; }
  const outBat = state.batting[outId];
  outBat.out = true; outBat.howOut = how;
  outBat.fielderId = fielderId; outBat.assistId = assistId;
  outBat.dismissalBowlerId = state.bowlerId;
  state.wickets += 1;
  state.balls += 1;
  const bowl = state.bowling[state.bowlerId];
  bowl.balls += 1;
  if(creditsBowler(how)) bowl.wickets += 1;
  state.thisOver.push({t:'wicket', v: runs>0 ? (runs+'+W') : 'W'});
  addCommentary(`WICKET! ${playerName(outId)} ${dismissalText(outBat)}`);
  trackHatTrick(creditsBowler(how));
  closeModal();
  if(checkInningsEnd()){ render(); return; }
  if(nextBatterId){
    ensureBatEntry(nextBatterId);
    if(!state.order.includes(nextBatterId)) state.order.push(nextBatterId);
    if(outId === state.strikerId){ state.strikerId = nextBatterId; }
    else { state.nonStrikerId = nextBatterId; }
  }
  finishBallProgress();
}

function openModal(m){ state.modal = m; render(); }
function closeModal(){ state.modal = null; render(); }

function pickBowler(id){
  state.bowlerId = id;
  ensureBowlEntry(id);
  closeModal();
}
function swapBatterManually(role){
  openModal({kind:'swapBatter', role});
}
function confirmSwapBatter(id){
  const role = state.modal.role;
  ensureBatEntry(id);
  if(role==='striker') state.strikerId = id; else state.nonStrikerId = id;
  if(!state.order.includes(id)) state.order.push(id);
  closeModal();
}
function toggleStrike(){
  if(!state.strikerId || !state.nonStrikerId) return;
  const tmp = state.strikerId; state.strikerId = state.nonStrikerId; state.nonStrikerId = tmp;
  render();
}

/* ===================== SETUP HANDLERS ===================== */
function updateTeamField(teamIdx, field, value){
  state.teams[teamIdx][field] = value;
  render();
}
function updatePlayerName(teamIdx, playerId, value){
  const p = findPlayer(teamIdx, playerId);
  p.name = value;
}
function updatePlayerPhoto(teamIdx, playerId, value){
  const p = findPlayer(teamIdx, playerId);
  p.photo = value; render();
}
function addPlayer(teamIdx){
  const t = state.teams[teamIdx];
  const n = t.players.length+1;
  t.players.push({id:t.id+'_p'+n+'_'+Date.now(), name:'Player '+n, photo:''});
  render();
}
function removePlayer(teamIdx, playerId){
  const t = state.teams[teamIdx];
  if(t.players.length<=2){ return; }
  t.players = t.players.filter(p=>p.id!==playerId);
  render();
}
function setOvers(v){
  state.oversLimit = Math.max(1, Math.min(50, parseInt(v)||20));
  render();
}
function setTab(tab){ state.currentTab = tab; render(); }

/* ===================== RENDER ===================== */
function root(){ return document.getElementById('root'); }

function renderBallChip(b){
  const cls = b.t==='four'?'four':b.t==='six'?'six':b.t==='wicket'?'wicket':b.t==='extra'?'extra':(b.v==='0'?'dot0':'');
  return `<div class="ball-chip ${cls}">${b.v}</div>`;
}

function render(){
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
  document.documentElement.style.setProperty('--team-a-c', team(0).color);
  document.documentElement.style.setProperty('--team-b-c', team(1).color);
  document.documentElement.style.setProperty('--batting-team-c', state.matchStarted ? team(state.battingTeamIdx).color : team(0).color);
  document.documentElement.style.setProperty('--bowling-team-c', state.matchStarted ? team(state.bowlingTeamIdx).color : team(1).color);

  let html = `
  <div class="brand">
    <div class="brand-mark">C</div>
    <div class="brand-name">Crease</div>
    <div class="brand-tag">Live Scoreboard</div>
  </div>`;

  if(state.lastMilestone) html += renderMilestoneBanner();
  if(state.lastHatTrick) html += renderHatTrickBanner();

  html += renderVersus();
  if(state.matchStarted) html += renderScorePanel();
  if(state.matchStarted && openersReady() && !state.matchOver) html += renderPlayRow();
  if(state.matchOver) html += renderResultBanner();

  html += renderTabs();
  html += `<div class="tab-panel">`;
  if(state.currentTab==='live') html += renderLiveExtra();
  if(state.currentTab==='batting') html += renderBattingTab();
  if(state.currentTab==='bowling') html += renderBowlingTab();
  if(state.currentTab==='squad') html += renderSquadTab();
  if(state.currentTab==='stream') html += renderStreamTab();
  if(state.currentTab==='setup') html += renderSetupTab();
  html += `</div>`;

  if(state.currentTab==='live' && state.matchStarted && openersReady() && !state.matchOver) html += (state.paused ? renderPauseBanner() : renderPad());

  root().innerHTML = html;

  if(state.modal) renderModal();
  broadcastState();
}

function renderVersus(){
  const a = team(0), b = team(1);
  const battingA = state.matchStarted && state.battingTeamIdx===0;
  const battingB = state.matchStarted && state.battingTeamIdx===1;
  const aScore = state.matchStarted ? (state.battingTeamIdx===0 ? `${state.score}/${state.wickets}` : (state.inningsHistory[0] && state.inningsHistory[0].teamIdx===0 ? `${state.inningsHistory[0].score}/${state.inningsHistory[0].wickets}` : '')) : '';
  const bScore = state.matchStarted ? (state.battingTeamIdx===1 ? `${state.score}/${state.wickets}` : (state.inningsHistory[0] && state.inningsHistory[0].teamIdx===1 ? `${state.inningsHistory[0].score}/${state.inningsHistory[0].wickets}` : '')) : '';
  let status = 'Set up your teams and start the match';
  if(state.matchStarted && !openersReady() && !state.matchOver){
    status = `Innings ${state.innings} · <b>${battingTeam().short}</b> batting · Choose your openers to begin`;
  } else if(state.matchStarted && !state.matchOver){
    status = `Innings ${state.innings} · <b>${battingTeam().short}</b> batting · Over ${oversStr(state.balls)} / ${state.oversLimit}`;
    if(state.innings===2) status += ` · Need <b>${Math.max(0,state.target-state.score)}</b> off <b>${Math.max(0,state.oversLimit*6-state.balls)}</b> balls`;
  } else if(state.matchOver){
    status = `Match complete`;
  }
  const tLine = tossSummary();
  if(tLine) status = `🪙 ${tLine} &nbsp;·&nbsp; ${status}`;
  if(state.paused) status = `<span style="color:var(--red);">⏸ PAUSED — ${state.pauseReason}</span> &nbsp;·&nbsp; ${status}`;
  return `
  <div class="versus">
    <div class="versus-side a">
      <div class="t-badge">${a.logo?`<img src="${a.logo}">`:initials(a.name)}</div>
      <div class="t-info">
        <div class="t-name">${a.name}</div>
        <div class="t-short">${a.short}${battingA?' · Batting':''}</div>
        ${aScore?`<div class="t-score">${aScore}</div>`:''}
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="versus-side b">
      <div class="t-info">
        <div class="t-name">${b.name}</div>
        <div class="t-short">${battingB?'Batting · ':''}${b.short}</div>
        ${bScore?`<div class="t-score">${bScore}</div>`:''}
      </div>
      <div class="t-badge">${b.logo?`<img src="${b.logo}">`:initials(b.name)}</div>
    </div>
  </div>
  <div class="match-status">${status}</div>`;
}

function renderScorePanel(){
  const r = rrr();
  return `
  <div class="score-panel">
    <div class="score-main">
      <div class="score-digits">${state.score}-${state.wickets}</div>
      <div class="score-overs">(${oversStr(state.balls)} ov)</div>
    </div>
    <div class="score-meta">
      <div class="meta-item"><span class="meta-label">CRR</span><span class="meta-val hot">${crr()}</span></div>
      <div class="meta-item"><span class="meta-label">Overs</span><span class="meta-val">${state.oversLimit}</span></div>
    </div>
    ${state.innings===2 && !state.matchOver ? `
    <div class="target-banner">
      <span class="target-banner-label">TARGET</span>
      <span class="target-banner-num">${state.target}</span>
      <span class="target-banner-sub">Need <b>${Math.max(0,state.target-state.score)}</b> off <b>${Math.max(0,state.oversLimit*6-state.balls)}</b> balls · RRR <b>${r}</b></span>
    </div>` : ''}
  </div>`;
}

function renderPlayRow(){
  const striker = state.batting[state.strikerId], nonStriker = state.batting[state.nonStrikerId];
  const bowl = state.bowling[state.bowlerId];
  const bowlP = findPlayerAny(state.bowlerId);
  const bowlTeamColor = team(state.bowlingTeamIdx).color;
  const sr = b => b && b.balls>0 ? ((b.runs/b.balls)*100).toFixed(1) : '0.0';
  const eco = b => b && b.balls>0 ? ((b.runs/b.balls)*6).toFixed(2) : '0.00';
  return `
  <div class="play-row">
    <div class="bats-card">
      <div class="bats-card-head">
        <span class="bats-card-label">Batting</span>
        <button class="swap-strike-btn" onclick="toggleStrike()" title="Swap who's on strike">⇌ Swap Strike</button>
      </div>
      <div class="bats-line" onclick="swapBatterManually('striker')">
        <div class="bats-name"><span class="dot"></span>${playerName(state.strikerId)}*</div>
        <div class="bats-stats"><b>${striker.runs}</b> (${striker.balls}) · SR ${sr(striker)}</div>
      </div>
      <div class="bats-line" onclick="swapBatterManually('nonStriker')">
        <div class="bats-name">${playerName(state.nonStrikerId)}</div>
        <div class="bats-stats"><b>${nonStriker.runs}</b> (${nonStriker.balls}) · SR ${sr(nonStriker)}</div>
      </div>
    </div>
    <div class="bowl-card">
      <div class="bowl-head" onclick="openModal({kind:'pickBowler'})">
        <div class="bowl-profile">
          <div class="avatar" style="${avatarStyle(bowlTeamColor)}">${bowlP && bowlP.photo?`<img src="${bowlP.photo}">`:initials(playerName(state.bowlerId))}</div>
          <div class="bowl-name">${playerName(state.bowlerId)}</div>
        </div>
        <div class="bowl-fig"><b>${bowl.wickets}-${bowl.runs}</b> (${oversStr(bowl.balls)}) · Econ ${eco(bowl)}</div>
      </div>
      <div class="over-dots">${state.thisOver.length ? state.thisOver.map(renderBallChip).join('') : '<span style="color:var(--dim);font-size:12px;">New over</span>'}</div>
    </div>
  </div>
  ${renderOverHistoryRow()}`;
}
function renderOverHistoryRow(){
  if(!state.overHistory || !state.overHistory.length) return '';
  const pills = state.overHistory.map(o=>{
    const short = initials(playerName(o.bowlerId));
    return `<div class="over-pill ${o.wickets>0?'wk':''}"><span class="op-num">Ov ${o.overNumber}</span><span class="op-runs">${o.runs}${o.wickets>0?'-'+o.wickets:''}</span><span class="op-bowler">${short}</span></div>`;
  }).join('');
  return `<div class="over-history-row"><div class="over-history-label">Over history</div><div class="over-history-scroll">${pills}</div></div>`;
}

function renderResultBanner(){
  return `<div class="result-banner">
    <div class="rb-title">🏆 ${state.result}</div>
    <div class="rb-sub">${team(state.inningsHistory[0].teamIdx).short} ${state.inningsHistory[0].score}/${state.inningsHistory[0].wickets} · ${team(state.inningsHistory[1].teamIdx).short} ${state.inningsHistory[1].score}/${state.inningsHistory[1].wickets}</div>
  </div>`;
}
function renderMilestoneBanner(){
  const m = state.lastMilestone;
  const label = m.milestone===100 ? 'CENTURY' : 'HALF-CENTURY';
  const emoji = m.milestone===100 ? '💯' : '🎉';
  return `<div class="celebrate-banner milestone">
    <button class="celebrate-close" onclick="dismissMilestone()">✕</button>
    <div class="celebrate-emoji">${emoji}</div>
    <div class="celebrate-text">
      <div class="celebrate-title">${label}!</div>
      <div class="celebrate-sub">${playerName(m.playerId)} reaches ${m.milestone} off ${m.ballsFaced} balls</div>
    </div>
  </div>`;
}
function renderHatTrickBanner(){
  const h = state.lastHatTrick;
  return `<div class="celebrate-banner hattrick">
    <button class="celebrate-close" onclick="dismissHatTrick()">✕</button>
    <div class="celebrate-emoji">🎩🏏</div>
    <div class="celebrate-text">
      <div class="celebrate-title">HAT-TRICK!</div>
      <div class="celebrate-sub">${playerName(h.bowlerId)} takes three wickets in three balls</div>
    </div>
  </div>`;
}
function renderCommentaryFeed(){
  if(!state.commentary || !state.commentary.length) return '';
  const recent = state.commentary.slice(-25).reverse();
  const rows = recent.map(c=>`<div class="comm-row"><span class="comm-over">${c.over}</span><span class="comm-text">${c.text}</span></div>`).join('');
  return `<div class="comm-feed"><div class="comm-feed-label">Ball by ball</div><div class="comm-feed-scroll">${rows}</div></div>`;
}

function renderTabs(){
  const tabs = [['live','Live'],['batting','Batting'],['bowling','Bowling'],['squad','Squad'],['stream','Stream'],['setup','Setup']];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab-btn ${state.currentTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
}

function renderLiveExtra(){
  if(!state.matchStarted) return `<div class="empty-note">No match running yet. Head to the <b style="color:var(--amber)">Setup</b> tab to configure teams and tap Start Match.</div>`;
  if(state.matchOver) return renderCommentaryFeed();
  if(!openersReady()) return `<div class="empty-note">Pick your opening batters and bowler in the popup to begin scoring.<br><br><button class="btn primary" onclick="openModal({kind:'pickOpeningStriker'})">Choose Openers</button></div>`;
  return `<div class="empty-note" style="padding-top:4px;">Tap a batter or bowler name above to make a manual correction.</div>${renderCommentaryFeed()}`;
}

function inningsBattingCard(inn, teamIdx){
  const t = team(teamIdx);
  const rows = inn.order.map(id=>{
    const b = inn.batting[id]; if(!b) return '';
    const sr = b.balls>0 ? ((b.runs/b.balls)*100).toFixed(1) : '0.0';
    return `<tr>
      <td class="player-cell">${playerName(id)}</td>
      <td>${b.out ? `<span class="status-pill out">${dismissalText(b)}</span>` : `<span class="status-pill notout">not out</span>`}</td>
      <td class="num">${b.runs}</td><td class="num">${b.balls}</td><td class="num">${b.fours}</td><td class="num">${b.sixes}</td><td class="num">${sr}</td>
    </tr>`;
  }).join('');
  const ex = inn.extras || {wide:0,noball:0,bye:0,legbye:0};
  return `
  <div class="section-title"><span class="bar"></span>${t.name} — ${inn.score}/${inn.wickets} (${oversStr(inn.balls)} ov)</div>
  <div class="extras-line">Extras: <b>${extrasSum(ex)}</b> <span class="extras-breakdown">(wd ${ex.wide}, nb ${ex.noball}, b ${ex.bye}, lb ${ex.legbye})</span></div>
  <table class="card-table">
    <thead><tr><th>Batter</th><th>Status</th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="empty-note">No batters yet</td></tr>'}</tbody>
  </table>`;
}
function inningsBowlingCard(inn, teamIdx){
  const t = team(teamIdx);
  const ids = Object.keys(inn.bowling);
  const rows = ids.map(id=>{
    const b = inn.bowling[id];
    const eco = b.balls>0 ? ((b.runs/b.balls)*6).toFixed(2) : '0.00';
    return `<tr><td class="player-cell">${playerName(id)}</td><td class="num">${oversStr(b.balls)}</td><td class="num">${b.runs}</td><td class="num">${b.wickets}</td><td class="num">${eco}</td></tr>`;
  }).join('');
  return `
  <div class="section-title"><span class="bar"></span>${t.name} bowling</div>
  <table class="card-table">
    <thead><tr><th>Bowler</th><th class="num">O</th><th class="num">R</th><th class="num">W</th><th class="num">Econ</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="empty-note">No bowlers yet</td></tr>'}</tbody>
  </table>`;
}

function renderBattingTab(){
  if(!state.matchStarted) return `<div class="empty-note">Start a match to see live batting stats.</div>`;
  let html = '';
  state.inningsHistory.forEach(inn=>{ html += inningsBattingCard(inn, inn.teamIdx); });
  if(!state.matchOver){
    const liveInn = {order:state.order, batting:state.batting, score:state.score, wickets:state.wickets, balls:state.balls, extras: state.extras};
    html += inningsBattingCard(liveInn, state.battingTeamIdx);
  }
  return html;
}
function renderBowlingTab(){
  if(!state.matchStarted) return `<div class="empty-note">Start a match to see live bowling figures.</div>`;
  let html = '';
  state.inningsHistory.forEach(inn=>{ html += inningsBowlingCard(inn, inn.teamIdx===0?1:0); });
  if(!state.matchOver){
    const liveInn = {bowling:state.bowling};
    html += inningsBowlingCard(liveInn, state.bowlingTeamIdx);
  }
  return html;
}

function renderSquadTab(){
  return `<div class="squad-grid">${state.teams.map((t,ti)=>`
    <div class="squad-team">
      <div class="squad-team-head" style="--tc:${t.color}">
        <div class="avatar" style="${avatarStyle(t.color)}">${t.logo?`<img src="${t.logo}">`:initials(t.name)}</div>
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;">${t.name}</div>
          <div style="font-size:11px;color:var(--muted);">${t.players.length} players</div>
        </div>
      </div>
      <div class="squad-list">
        ${t.players.map(p=>`
          <div class="squad-player">
            <div class="avatar" style="${avatarStyle(t.color)}">${p.photo?`<img src="${p.photo}">`:initials(p.name)}</div>
            <input type="text" value="${p.name.replace(/"/g,'&quot;')}" onchange="updatePlayerName(${ti},'${p.id}', this.value)" placeholder="Player name">
            <button class="icon-btn" title="Remove" onclick="removePlayer(${ti},'${p.id}')">✕</button>
          </div>`).join('')}
        <div class="add-player-row"><button class="btn full" onclick="addPlayer(${ti})">+ Add player</button></div>
      </div>
    </div>`).join('')}</div>`;
}

function renderStreamTab(){
  const snap = buildOverlaySnapshot();
  return `
  <div class="setup-card">
    <div class="section-title" style="margin-top:0;"><span class="bar"></span>Live stream overlays</div>
    <p style="color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px;">
      Pick any of the banners below and add its link as a Browser Source in OBS, Streamlabs, or similar. Each one is
      transparent and updates live the moment you score a ball — you can even run several of them at once as separate
      sources (e.g. Lower Third + Corner Bug together).
    </p>
    ${renderCloudSyncCard()}
    ${OVERLAY_TYPES.map(t=>renderOverlayTypeCard(t, snap)).join('')}
  </div>`;
}
let suggestedRoomCode = null;
function getSuggestedRoomCode(){
  if(!suggestedRoomCode) suggestedRoomCode = generateRoomCode();
  return suggestedRoomCode;
}
function renderCloudSyncCard(){
  const connected = cloudConfigured();
  return `
  <div class="ov-type-card" style="border-color:${connected?'rgba(58,209,130,.5)':'var(--border)'};">
    <div class="ov-type-head">
      <div class="ov-type-label">${connected ? '🟢' : '⚪'} Cloud Sync ${connected ? '— Active' : '(optional)'}</div>
      <div class="ov-type-desc">
        ${connected

      </div>
    </div>
    ${!connected ? `
    <details style="margin-bottom:12px;">
      <summary style="cursor:pointer;color:var(--amber);font-size:12.5px;font-weight:600;">How to set this up →</summary>
      <ol style="color:var(--muted);font-size:12px;line-height:1.9;margin:10px 0 0;padding-left:18px;">
        <li>Go to <span style="color:var(--text);">console.firebase.google.com</span> → Create a project (free "Spark" plan)</li>
        <li>In the left menu, open <b style="color:var(--text);">Build → Realtime Database</b> → Create Database → start in <b>test mode</b></li>
        <li>Copy the database URL shown at the top (looks like <span style="color:var(--text);">https://your-project-default-rtdb.firebaseio.com</span>)</li>
        <li>Paste it below, pick any room code (or generate one), and hit Save</li>
      </ol>
      <p style="color:var(--dim);font-size:11px;line-height:1.6;margin:10px 0 0;">
        ⚠️ Test mode makes that database publicly readable/writable — fine for a live match score, but don't store anything sensitive in it.

    </details>
    <div class="field-row" style="margin-bottom:8px;flex-wrap:wrap;">
      <input type="text" id="cloudDbInput" placeholder="https://your-project-default-rtdb.firebaseio.com" value="${cloudConfig.databaseURL||''}" style="flex:2;min-width:220px;">

    <div class="field-row">

    <div class="field-row">
      <button class="btn danger" onclick="clearCloudConfig()">Disconnect (back to same-browser only)</button>
    </div>`}
  </div>`;

function renderOverlayTypeCard(t, snap){
  const link = overlayLink(t.key);
  return `
  <div class="ov-type-card">
    <div class="ov-type-head">
      <div>
        <div class="ov-type-label">${t.label}</div>
        <div class="ov-type-desc">${t.desc}</div>
      </div>
    </div>
    <div class="field-row" style="margin-bottom:10px;flex-wrap:wrap;">
      <input type="text" readonly value="${link}" onclick="this.select()" style="flex:1;min-width:200px;">

      <button class="btn" onclick="window.open('${link}','_blank')">Preview</button>
    </div>
    <div class="ov-stage preview-stage stage-${t.key}">${overlayContentHTML(snap, t.key)}</div>
  </div>`;
}
function renderTossCard(){
  const t = state.toss;
  return `
  <div class="setup-card" style="margin-top:16px;">
    <div class="setup-card-head">
      <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#c97b0e);display:flex;align-items:center;justify-content:center;font-size:18px;">🪙</div>
      <div>
        <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;">Toss</div>
        <div style="font-size:11px;color:var(--muted);">${tossSummary() || 'Not decided yet — defaults to ' + team(0).short + ' batting first'}</div>
      </div>
    </div>
    <div class="field-row" style="margin-bottom:${t.winnerIdx!=null?'12px':'0'};gap:8px;flex-wrap:wrap;">
      <button class="btn" style="flex:1;min-width:120px;" onclick="flipCoin()">🎲 Flip Coin</button>
      <button class="btn ${t.winnerIdx===0?'primary':''}" style="flex:1;min-width:120px;" onclick="setTossWinner(0)">${team(0).short} won</button>
      <button class="btn ${t.winnerIdx===1?'primary':''}" style="flex:1;min-width:120px;" onclick="setTossWinner(1)">${team(1).short} won</button>
    </div>
    ${t.winnerIdx!=null ? `
    <div class="field-row" style="gap:8px;flex-wrap:wrap;">
      <button class="btn ${t.decision==='bat'?'primary':''}" style="flex:1;min-width:120px;" onclick="setTossDecision('bat')">Elected to Bat</button>
      <button class="btn ${t.decision==='bowl'?'primary':''}" style="flex:1;min-width:120px;" onclick="setTossDecision('bowl')">Elected to Bowl</button>
      <button class="btn danger" onclick="resetToss()">Reset</button>
    </div>` : ''}
  </div>`;
}
function renderSetupTab(){
  return `
  <div class="setup-grid">
    ${state.teams.map((t,ti)=>`
      <div class="setup-card">
        <div class="setup-card-head">
          <div class="avatar" style="${avatarStyle(t.color)};width:40px;height:40px;">${t.logo?`<img src="${t.logo}">`:initials(t.name)}</div>
          <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;">Team ${ti===0?'A':'B'}</div>
        </div>
        <div class="field">
          <label class="field-label">Team name</label>
          <input type="text" value="${t.name.replace(/"/g,'&quot;')}" onchange="updateTeamField(${ti},'name',this.value)">
        </div>
        <div class="field-row" style="margin-bottom:12px;">
          <div class="field" style="flex:1;margin-bottom:0;">
            <label class="field-label">Short code</label>
            <input type="text" maxlength="4" value="${t.short.replace(/"/g,'&quot;')}" onchange="updateTeamField(${ti},'short',this.value.toUpperCase())">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="field-label">Color</label>
            <input type="color" value="${t.color}" onchange="updateTeamField(${ti},'color',this.value)">
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Logo image URL (optional)</label>
          <input type="url" value="${t.logo}" placeholder="https://..." onchange="updateTeamField(${ti},'logo',this.value)">
        </div>
      </div>`).join('')}
  </div>
  ${renderTossCard()}
  <div class="setup-card" style="margin-top:16px;">
    <div class="field-row" style="align-items:flex-end;flex-wrap:wrap;gap:14px;">
      <div class="field" style="max-width:140px;margin-bottom:0;">
        <label class="field-label">Overs per innings</label>
        <input type="number" min="1" max="50" value="${state.oversLimit}" onchange="setOvers(this.value)">
      </div>
      <button class="btn primary" style="flex:1;min-width:180px;" onclick="startMatch()">${state.matchStarted?'Restart Match':'Start Match'}</button>
      ${state.matchStarted?`<button class="btn danger" onclick="newMatch()">New Match</button>`:''}
    </div>
  </div>`;
}

function renderPad(){
  return `
  <div class="pad-wrap">
    <div class="pad">
      <div class="pad-runs">
        ${[0,1,2,3,4,5,6,7].map(r=>{
          const cls = r===4?'four':r===6?'six':'';
          return `<button class="pad-btn ${cls}" onclick="addRuns(${r})">${r}</button>`;
        }).join('')}
      </div>
      <div class="pad-extra">
        <button class="pad-btn" onclick="addExtra('wide')">Wide</button>
        <button class="pad-btn" onclick="addExtra('noball')">No Ball</button>
        <button class="pad-btn" onclick="openModal({kind:'byeRuns', legbye:false})">Bye</button>
        <button class="pad-btn" onclick="openModal({kind:'byeRuns', legbye:true})">Leg Bye</button>
        <button class="pad-btn wicket" onclick="openWicketFlow()">Wicket</button>
        <button class="pad-btn" onclick="undo()">Undo</button>
        <button class="pad-btn pause" onclick="openModal({kind:'pauseReason'})">⏸ Pause</button>
        <button class="pad-btn end-innings" onclick="openModal({kind:'confirmEndInnings'})">End Innings</button>
      </div>
    </div>
  </div>`;
}
function renderPauseBanner(){
  const showDLS = state.pauseReason==='Rain Delay' && state.innings===2 && !state.matchOver && state.inningsHistory[0];
  return `
  <div class="pad-wrap">
    <div class="pause-banner">
      <div class="pause-icon">⏸</div>
      <div class="pause-info">
        <div class="pause-title">Match Paused</div>
        <div class="pause-reason">${state.pauseReason}${state.dls.active ? ` · DLS revised: target ${state.dls.revisedTarget} off ${state.dls.revisedOvers} overs` : ''}</div>
      </div>
      <div class="pause-actions">
        ${showDLS ? `<button class="btn primary" onclick="openModal({kind:'dlsRevise'})">Revise Target (DLS)</button>` : ''}
        <button class="btn" onclick="resumeMatch()">Resume Match</button>
      </div>
    </div>
  </div>`;
}

/* ---- MODAL RENDERING ---- */
function renderModal(){
  const m = state.modal;
  let inner = '';
  if(m.kind==='pickOpeningStriker'){
    const opts = battersOf(state.battingTeamIdx);
    inner = `<div class="modal-title">${team(state.battingTeamIdx).short} — select the striker (on strike)</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmOpeningStriker('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickOpeningNonStriker'){
    const opts = battersOf(state.battingTeamIdx).filter(p=>p.id!==state.strikerId);
    inner = `<div class="modal-title">${team(state.battingTeamIdx).short} — select the non-striker</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmOpeningNonStriker('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickOpeningBowler'){
    const opts = battersOf(state.bowlingTeamIdx);
    inner = `<div class="modal-title">${team(state.bowlingTeamIdx).short} — select the opening bowler</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmOpeningBowler('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickBowler'){
    inner = `<div class="modal-title">Select bowler — next over</div>
      <div class="modal-choice-grid">${bowlerOptions().map(p=>`<div class="modal-choice" onclick="pickBowler('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='wicketType'){
    inner = `<div class="modal-title">How was ${playerName(state.strikerId)} out?</div>
      <div class="modal-choice-grid">${WICKET_TYPES.map(t=>`<div class="modal-choice" onclick="confirmWicketType('${t}')">${t}</div>`).join('')}</div>`;
  } else if(m.kind==='pickRunOutEnd'){
    inner = `<div class="modal-title">Which batter is run out?</div>
      <div class="modal-choice-grid">
        <div class="modal-choice" onclick="confirmRunOutEnd('${state.strikerId}')">${playerName(state.strikerId)}<small>on strike</small></div>
        <div class="modal-choice" onclick="confirmRunOutEnd('${state.nonStrikerId}')">${playerName(state.nonStrikerId)}<small>non-striker</small></div>
      </div>`;
  } else if(m.kind==='pickRunOutRuns'){
    inner = `<div class="modal-title">Runs completed before the run out?</div>
      <div class="modal-choice-grid">${[0,1,2,3].map(r=>`<div class="modal-choice" onclick="confirmRunOutRuns(${r})">${r} run${r===1?'':'s'}</div>`).join('')}</div>`;
  } else if(m.kind==='pickRunOutFielder'){
    const opts = battersOf(state.bowlingTeamIdx);
    inner = `<div class="modal-title">Who ran the batter out?</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmRunOutFielder('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickRunOutAssist'){
    const opts = battersOf(state.bowlingTeamIdx).filter(p=>p.id!==m.fielderId);
    inner = `<div class="modal-title">Any assist? (optional)</div>
      <div class="modal-choice-grid">
        <div class="modal-choice" onclick="confirmRunOutAssist(null)"><b style="color:var(--muted)">No assist</b></div>
        ${opts.map(p=>`<div class="modal-choice" onclick="confirmRunOutAssist('${p.id}')">${p.name}</div>`).join('')}
      </div>`;
  } else if(m.kind==='pickCatcher'){
    const opts = battersOf(state.bowlingTeamIdx);
    inner = `<div class="modal-title">Who took the catch?</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmCatcher('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickStumper'){
    const opts = battersOf(state.bowlingTeamIdx);
    inner = `<div class="modal-title">Who stumped the batter?</div>
      <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmStumper('${p.id}')">${p.name}</div>`).join('')}</div>`;
  } else if(m.kind==='pickNextBatter'){
    const opts = nextBatterOptions();
    const outName = playerName(m.outId);
    if(opts.length===0){
      inner = `<div class="modal-title">All out</div><div class="modal-choice" onclick="confirmWicket(null)">Confirm — end innings</div>`;
    } else {
      inner = `<div class="modal-title">${outName} is out (${m.how}) — next batter in</div>
        <div class="modal-choice-grid">${opts.map(p=>`<div class="modal-choice" onclick="confirmWicket('${p.id}')">${p.name}</div>`).join('')}</div>`;
    }
  } else if(m.kind==='byeRuns'){
    inner = `<div class="modal-title">${m.legbye?'Leg byes':'Byes'} — how many runs?</div>
      <div class="modal-choice-grid">${[1,2,3,4].map(r=>`<div class="modal-choice" onclick="addByes(${r},${m.legbye})">${r} run${r>1?'s':''}</div>`).join('')}</div>`;
  } else if(m.kind==='noBallRuns'){
    inner = `<div class="modal-title">No ball — runs off the bat?</div>
      <div class="modal-choice-grid">${[0,1,2,3,4,5,6,7].map(r=>`<div class="modal-choice" onclick="confirmNoBall(${r})">${r}</div>`).join('')}</div>`;
  } else if(m.kind==='wideRuns'){
    inner = `<div class="modal-title">Wide — any additional runs?</div>
      <p style="color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 12px;">1 run is always added for the wide itself. Pick extra runs if the batters ran or it went to the boundary.</p>
      <div class="modal-choice-grid">${[0,1,2,3,4].map(r=>`<div class="modal-choice" onclick="confirmWideRuns(${r})">${r===0?'None (just 1)':'+'+r}</div>`).join('')}</div>`;
  } else if(m.kind==='pauseReason'){
    inner = `<div class="modal-title">Pause match — reason</div>
      <div class="modal-choice-grid">${PAUSE_REASONS.map(r=>`<div class="modal-choice" onclick="pauseMatch('${r}')">${r}</div>`).join('')}</div>`;
  } else if(m.kind==='dlsRevise'){
    const minOvers = Math.max(1, Math.ceil(state.balls/6));
    inner = `<div class="modal-title">Revise target — simplified DLS</div>
      <p style="color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 14px;">
        Enter the new total overs for this innings after the interruption. This uses an approximate, resource-based
        estimate for quick scoring purposes — it is not the official ICC Duckworth-Lewis-Stern calculation.
      </p>
      <div class="field" style="margin-bottom:14px;">
        <label class="field-label">New overs limit (currently ${state.oversLimit}, min ${minOvers})</label>
        <input type="number" id="dlsOversInput" min="${minOvers}" max="${state.oversLimit}" value="${state.oversLimit}">
      </div>
      <button class="btn primary full" onclick="applyDLSFromInput()">Apply Revised Target</button>`;
  } else if(m.kind==='confirmEndInnings'){
    inner = `<div class="modal-title">End this innings early?</div>
      <p style="color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 14px;">
        This closes out the current innings right away — useful for a declaration, forfeiture, or to jump ahead.
        The score stays exactly as it is now.
      </p>
      <div class="modal-choice-grid">
        <div class="modal-choice" onclick="forceEndInnings()"><b style="color:var(--red)">Yes, end innings</b></div>
        <div class="modal-choice" onclick="closeModal()">Cancel</div>
      </div>`;
  } else if(m.kind==='superOverPrompt'){
    inner = `<div class="modal-title">🏏 ${state.result}!</div>
      <p style="color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px;">
        The scores are level. Play a Super Over to decide the winner?
      </p>
      <div class="modal-choice-grid">
        <div class="modal-choice" onclick="startSuperOver()"><b style="color:var(--amber)">Start Super Over</b></div>
        <div class="modal-choice" onclick="closeModal()">Not now</div>
      </div>`;
  } else if(m.kind==='swapBatter'){
    const players = battersOf(state.battingTeamIdx).filter(p=>p.id!==state.strikerId && p.id!==state.nonStrikerId);
    inner = `<div class="modal-title">Set ${m.role==='striker'?'striker':'non-striker'}</div>
      <div class="modal-choice-grid">${players.map(p=>`<div class="modal-choice" onclick="confirmSwapBatter('${p.id}')">${p.name}</div>`).join('')}</div>`;
  }
  const mandatory = MANDATORY_MODALS.includes(m.kind);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">${mandatory?'':'<button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>'}${inner}</div>`;
  overlay.addEventListener('click', (e)=>{ if(!mandatory && e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

/* ===================== INIT ===================== */
if(overlayMode){ initOverlayPage(); } else { render(); }
</script>
</body>
</html>
